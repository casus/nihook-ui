<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <h1>Container Manager</h1>
            <div class="auth-info" id="auth-info">
                <span id="username-display"></span>
                <button id="logout-btn" class="logout-btn">Logout</button>
            </div>
        </div>
    </nav>
    <div class="main-content">
        <div class="table-container">
            <h2>Your Containers</h2>
            <button id="create-container-btn" class="create-btn">Create New Container</button>
            <table id="containers-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Settings</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be added by TypeScript -->
            </tbody>
        </table>
    </div>
    
    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Container Settings</h2>
            <form id="settings-form">
                <div class="form-group">
                    <label for="container-title">Name:</label>
                    <input type="text" id="container-title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="container-description">Description:</label>
                    <textarea id="container-description" name="description"></textarea>
                </div>
                <button type="submit">Save</button>
            </form>
        </div>
    </div>

    <!-- Logs Modal -->
    <div id="logs-modal" class="modal">
        <div class="modal-content logs-modal-content">
            <span class="close">&times;</span>
            <h2>Container Logs</h2>
            <div id="logs-container">
                <div id="log-files-list"></div>
                <div id="log-content-viewer">
                    <div id="log-header">
                        <h3 id="current-log-filename"></h3>
                        <div class="log-actions">
                            <button id="refresh-log-btn" class="action-btn">Refresh</button>
                            <button id="download-log-btn" class="action-btn">Download</button>
                        </div>
                    </div>
                    <div id="log-content"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Container Info Modal -->
    <div id="container-info-modal" class="modal">
        <div class="modal-content container-info-modal-content">
            <span class="close">&times;</span>
            <h2 id="container-info-title">Container Information</h2>
            <div id="container-info-content">
                <div class="container-info-section">
                    <h3>Basic Information</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">Name:</span>
                            <span class="info-value" id="container-info-name"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Status:</span>
                            <span class="info-value" id="container-info-status"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Folder Path:</span>
                            <span class="info-value" id="container-info-folder-path"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Port:</span>
                            <span class="info-value" id="container-info-port"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Public URL:</span>
                            <a class="info-value" id="container-info-url" href="" target="_blank"></a>
                        </div>
                    </div>
                </div>
                <div class="container-info-section">
                    <h3>Instructions</h3>
                    <div class="instructions-content" id="container-info-instructions"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./out/app.js"></script>
    <script>
        // Check authentication status on page load
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('access_token');
            const username = localStorage.getItem('username');
            
            if (!token) {
                // Redirect to login if not authenticated
                window.location.href = '/login';
                return;
            }
            
            // Show username and logout button
            document.getElementById('username-display').textContent = `Logged in as: ${username}`;
            
            // Set up logout button
            document.getElementById('logout-btn').addEventListener('click', async function() {
                try {
                    const response = await fetch('/logout', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        // Clear local storage and redirect
                        localStorage.removeItem('access_token');
                        localStorage.removeItem('user_id');
                        localStorage.removeItem('username');
                        window.location.href = '/login';
                    }
                } catch (error) {
                    console.error('Logout error:', error);
                }
            });
        });
    </script>
</body>
</html>
